<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMDb Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>IMDb List Scraper</h1>

    <form method="POST">
        <label>Enter IMDb List URL:</label>
        <input type="text" name="imdb_url"
               value="https://www.imdb.com/list/ls543298865/" required>
        <button type="submit">Scrape Movies</button>
    </form>

    {% if movies %}
        <h2>Movies Found: {{ movies|length }}</h2>

        <a class="download" href="{{ url_for('download_file', filename=csv_file) }}">
            Download CSV
        </a>

        <table>
            <tr>
                <th>Rank</th>
                <th>Title</th>
                <th>Year</th>
                <th>IMDb Rating</th>
                <th>URL</th>
            </tr>

            {% for movie in movies %}
            <tr>
                <td>{{ movie[0] }}</td>
                <td>{{ movie[1] }}</td>
                <td>{{ movie[2] }}</td>
                <td>{{ movie[3] }}</td>
                <td><a href="{{ movie[4] }}" target="_blank">Link</a></td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}
</div>
</body>
</html>
